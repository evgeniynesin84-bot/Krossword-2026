<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кроссворд‑новости</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f5f3ee;
            --paper: #fffef9;
            --ink: #1a1814;
            --ink2: #5a5650;
            --ink3: #9a9690;
            --accent: #c8401a;
            --accent2: #2a5c8a;
            --border: #d8d4cc;
            --cell-size: 44px;
            --highlight: #fef3e2;
            --highlight-border: #e8a020;
            --active: #fff0e8;
            --active-border: #c8401a;
            --correct: #e8f5e0;
            --correct-border: #4a9a20;
            --wrong: #fde8e8;
            --wrong-border: #d04040;
            --hint-given: #eef4ff;
            --hint-given-border: #2a5c8a;
            --solved-clue: #9a9690;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overscroll-behavior: none;
        }

        .masthead {
            background: var(--paper);
            border-bottom: 3px double var(--ink);
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .masthead-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
        .masthead-sub { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); margin-top: 2px; }
        .mode-pill { padding: 4px 14px; border-radius: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: 1.5px solid currentColor; }
        .mode-editor { color: var(--accent2); }
        .mode-player { color: var(--accent); }

        .layout { max-width: 1000px; margin: 0 auto; padding: 0.75rem 1rem; display: flex; flex-direction: column; gap: 0.75rem; }

        .section { background: var(--paper); border: 1px solid var(--border); padding: 0.875rem; }
        .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink3); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 0.75rem; }

        .grid-scroll { overflow-x: auto; padding: 0.5rem 0; display: flex; justify-content: flex-start; -webkit-overflow-scrolling: touch; }
        .grid-container { display: inline-grid; gap: 1px; border: 2px solid var(--ink); background: var(--ink); user-select: none; touch-action: manipulation; }
        .cell {
            width: var(--cell-size); height: var(--cell-size);
            background: var(--paper); position: relative; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.1s; font-weight: 700; font-size: 17px; color: var(--ink);
            -webkit-tap-highlight-color: transparent;
        }
        .cell.black { background: #1a1814; cursor: default; }
        .cell.highlight { background: var(--highlight); outline: 1px solid var(--highlight-border); outline-offset: -1px; }
        .cell.active-cell { background: var(--active); outline: 2px solid var(--active-border); outline-offset: -2px; z-index: 2; }
        .cell.correct-cell { background: var(--correct); outline: 1px solid var(--correct-border); }
        .cell.wrong-cell { background: var(--wrong); outline: 1px solid var(--wrong-border); }
        .cell.hint-cell { background: var(--hint-given); outline: 1px solid var(--hint-given-border); outline-offset: -1px; }
        .cell-num { position: absolute; top: 1px; left: 3px; font-size: 9px; font-weight: 700; color: var(--ink2); line-height: 1; pointer-events: none; }
        .cell input {
            width: 100%; height: 100%; background: none; border: none; outline: none;
            text-align: center; font-size: 17px; font-family: 'Georgia', serif; font-weight: 700;
            color: var(--ink); text-transform: uppercase; cursor: pointer; padding-top: 8px;
            caret-color: transparent;
            -webkit-user-select: none; user-select: none;
            autocomplete: off;
            touch-action: manipulation;
        }

        .btn { font-family: 'Georgia', serif; font-size: 13px; padding: 9px 16px; border: 1.5px solid var(--ink); background: none; color: var(--ink); cursor: pointer; letter-spacing: 0.03em; transition: all 0.15s; white-space: nowrap; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .btn:hover { background: var(--ink); color: var(--paper); }
        .btn:active { opacity: 0.7; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 700; }
        .btn-primary:hover { background: #a83212; border-color: #a83212; color: white; }
        .btn-hint { background: var(--accent2); border-color: var(--accent2); color: white; font-weight: 700; }
        .btn-hint:hover { background: #1e4570; border-color: #1e4570; color: white; }
        .btn-sm { font-size: 11px; padding: 7px 11px; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 0.5rem; }

        .field { margin-bottom: 0.75rem; }
        .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink2); margin-bottom: 4px; }
        .field input, .field textarea { width: 100%; font-family: 'Georgia', serif; font-size: 14px; padding: 8px 10px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); outline: none; transition: border-color 0.15s; border-radius: 0; -webkit-appearance: none; }
        .field input:focus, .field textarea:focus { border-color: var(--accent); }
        .field textarea { resize: vertical; min-height: 56px; }

        .word-editor-item { border: 1px solid var(--border); padding: 0.75rem; margin-bottom: 0.75rem; background: var(--bg); position: relative; }
        .word-editor-item.editing { border-color: var(--accent); background: var(--paper); }
        .word-editor-header { display: flex; align-items: center; gap: 8px; margin-bottom: 0.4rem; }
        .word-editor-num { font-size: 11px; font-weight: 700; background: var(--ink); color: var(--paper); padding: 2px 7px; letter-spacing: 0.05em; flex-shrink: 0; }
        .word-editor-word { font-weight: 700; font-size: 15px; }
        .word-editor-len { font-size: 11px; color: var(--ink3); margin-left: auto; white-space: nowrap; }
        .word-editor-clue { font-size: 13px; color: var(--ink2); line-height: 1.4; margin-bottom: 0.3rem; }
        .word-editor-hint-url { font-size: 11px; color: var(--ink3); word-break: break-all; }
        .word-editor-actions { display: flex; gap: 6px; margin-top: 0.5rem; }
        .word-editor-del { background: none; border: 1px solid var(--border); color: var(--ink3); cursor: pointer; font-size: 12px; padding: 3px 9px; font-family: 'Georgia', serif; }
        .word-editor-del:hover { color: var(--accent); border-color: var(--accent); }
        .word-editor-edit { background: none; border: 1px solid var(--border); color: var(--ink2); cursor: pointer; font-size: 12px; padding: 3px 9px; font-family: 'Georgia', serif; }
        .word-editor-edit:hover { color: var(--accent2); border-color: var(--accent2); }
        .word-editor-save { background: var(--accent2); border: 1px solid var(--accent2); color: white; cursor: pointer; font-size: 12px; padding: 3px 9px; font-family: 'Georgia', serif; }
        .inline-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 0.5rem; }
        .inline-edit-grid .full { grid-column: 1/-1; }
        .inline-edit-label { font-size: 10px; color: var(--ink3); display: block; margin-bottom: 2px; letter-spacing: 0.08em; text-transform: uppercase; }
        .inline-edit-input { font-size: 13px; padding: 5px 8px; width: 100%; border: 1px solid var(--border); background: var(--paper); color: var(--ink); font-family: 'Georgia', serif; outline: none; -webkit-appearance: none; border-radius: 0; }
        .inline-edit-input:focus { border-color: var(--accent); }

        .dup-warning { font-size: 12px; color: var(--accent); margin-top: 4px; display: none; }
        .dup-warning.visible { display: block; }

        .import-tabs { display: flex; gap: 0; margin-bottom: 0.875rem; border-bottom: 1px solid var(--border); }
        .import-tab { font-family: 'Georgia', serif; font-size: 12px; padding: 6px 14px; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; color: var(--ink3); letter-spacing: 0.04em; margin-bottom: -1px; }
        .import-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); font-weight: 700; }
        .import-panel { display: none; }
        .import-panel.active { display: block; }
        .import-drop-zone { border: 2px dashed var(--border); padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
        .import-drop-zone:hover, .import-drop-zone.dragover { border-color: var(--accent2); background: #f0f5fb; }
        .import-drop-label { font-size: 13px; color: var(--ink2); margin-bottom: 0.5rem; }
        .import-drop-sub { font-size: 11px; color: var(--ink3); }
        .import-file-input { display: none; }
        .import-format-hint { font-size: 11px; color: var(--ink3); margin-top: 0.625rem; line-height: 1.6; background: var(--bg); padding: 0.5rem 0.75rem; border-left: 2px solid var(--border); }
        .import-format-hint code { font-family: monospace; font-size: 11px; color: var(--ink2); }
        .import-result { margin-top: 0.75rem; font-size: 13px; display: none; }
        .import-result.ok { color: #2a7a20; display: block; }
        .import-result.err { color: var(--accent); display: block; }

        .clues-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 600px) { .clues-cols { grid-template-columns: 1fr; } }
        .clues-dir-title { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink2); margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
        .clue-player { display: flex; gap: 6px; padding: 6px 4px; cursor: pointer; border-left: 2px solid transparent; transition: all 0.12s; margin-bottom: 2px; -webkit-tap-highlight-color: transparent; }
        .clue-player:hover { background: var(--highlight); border-left-color: var(--highlight-border); }
        .clue-player.active-clue { background: var(--active); border-left-color: var(--active-border); }
        .clue-player.solved-clue { opacity: 0.45; }
        .clue-player-num { font-size: 12px; font-weight: 700; color: var(--accent2); min-width: 20px; line-height: 1.5; }
        .clue-player-text { font-size: 13px; line-height: 1.45; color: var(--ink); }
        .clue-hint-link { display: inline-block; font-size: 11px; color: var(--accent2); text-decoration: none; margin-top: 2px; letter-spacing: 0.02em; }
        .clue-hint-link:hover { text-decoration: underline; }

        .active-clue-box { background: var(--active); border: 1.5px solid var(--active-border); padding: 0.75rem; margin: 0.5rem 0; min-height: 3rem; font-size: 14px; }
        .active-clue-box .num { font-size: 11px; font-weight: 700; color: var(--ink2); margin-bottom: 2px; }
        .hint-visible { margin-top: 4px; font-size: 12px; }

        .mobile-clue-bar {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--paper);
            border-top: 2px solid var(--active-border);
            padding: 0.5rem 1rem;
            z-index: 200;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.12);
        }
        .mobile-clue-bar.visible { display: flex; align-items: center; gap: 0.5rem; }
        .mobile-clue-nav { display: flex; gap: 4px; flex-shrink: 0; }
        .mobile-clue-nav button { font-size: 18px; background: none; border: none; cursor: pointer; padding: 4px 8px; color: var(--ink); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .mobile-clue-content { flex: 1; min-width: 0; }
        .mobile-clue-num { font-size: 10px; font-weight: 700; color: var(--ink2); letter-spacing: 0.08em; }
        .mobile-clue-text { font-size: 13px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mobile-clue-dir-btn { background: var(--bg); border: 1px solid var(--border); font-size: 11px; font-family: 'Georgia', serif; padding: 4px 8px; cursor: pointer; flex-shrink: 0; touch-action: manipulation; }

        body.mobile-bar-visible .layout { padding-bottom: 4rem; }

        .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 0.25rem; }
        .progress-track { flex: 1; height: 4px; background: var(--border); }
        .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
        .progress-label { font-size: 12px; color: var(--ink2); white-space: nowrap; }

        .timer-box { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .timer-box .direction-hint { font-size: 13px; font-weight: 400; color: var(--ink2); }

        .congrats-box { background: var(--correct); border: 2px solid var(--correct-border); padding: 1.5rem; text-align: center; display: none; margin: 0.5rem 0; }
        .congrats-box h2 { font-size: 22px; margin-bottom: 0.5rem; }
        .congrats-box p { font-size: 14px; color: var(--ink2); }
        .congrats-box ul { list-style: none; padding: 0; margin: 1rem 0; text-align: left; }
        .congrats-box li { font-size: 13px; padding: 2px 0; }

        .btn-share { background: #25a244; border-color: #25a244; color: white; font-weight: 700; margin-top: 1rem; font-size: 14px; padding: 10px 22px; }
        .btn-share:hover { background: #1a8035; border-color: #1a8035; color: white; }
        .btn-share:disabled { opacity: 0.6; cursor: default; }

        #share-card {
            background: var(--paper);
            border: 2px solid var(--ink);
            padding: 1.5rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--ink);
            max-width: 480px;
            margin: 1rem auto 0;
            display: none;
        }
        #share-card.visible { display: block; }
        .share-card-header { border-bottom: 3px double var(--ink); padding-bottom: 0.75rem; margin-bottom: 1rem; }
        .share-card-title { font-size: 20px; font-weight: 700; }
        .share-card-sub { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink2); margin-top: 3px; }
        .share-card-stats { display: flex; gap: 2rem; margin-bottom: 1rem; }
        .share-stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink3); margin-bottom: 2px; }
        .share-stat-val { font-size: 22px; font-weight: 700; }
        .share-grid-wrap { display: flex; justify-content: center; margin-bottom: 1rem; }
        .share-grid { display: inline-grid; gap: 1px; border: 2px solid var(--ink); background: var(--ink); }
        .share-cell { width: 22px; height: 22px; background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--ink); position: relative; }
        .share-cell.s-black { background: var(--ink); }
        .share-cell.s-letter { background: var(--correct); }
        .share-cell-num { position: absolute; top: 0px; left: 1px; font-size: 5px; font-weight: 700; color: var(--ink2); line-height: 1; }
        .share-card-footer { font-size: 10px; color: var(--ink3); text-align: right; letter-spacing: 0.08em; border-top: 1px solid var(--border); padding-top: 0.5rem; margin-top: 0.5rem; }

        .link-box { background: var(--bg); border: 1px solid var(--border); padding: 0.75rem 1rem; font-family: monospace; font-size: 11px; word-break: break-all; color: var(--ink2); cursor: pointer; margin-top: 0.625rem; line-height: 1.5; }
        .link-box:hover { border-color: var(--accent2); }
        .link-note { font-size: 11px; color: var(--ink3); margin-top: 4px; }

        .grid-warning { background: #fff8e8; border: 1px solid #e8a020; padding: 0.6rem 0.875rem; font-size: 13px; color: #7a5000; margin-top: 0.75rem; display: none; }
        .grid-warning.visible { display: block; }

        .penalty-flash { color: var(--accent) !important; animation: flash 0.6s ease; }
        @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.3} }

        @media (max-width: 480px) {
            :root { --cell-size: 38px; }
            .masthead { padding: 0.6rem 1rem; }
            .masthead-title { font-size: 18px; }
            .layout { padding: 0.5rem 0.625rem; gap: 0.5rem; }
            .section { padding: 0.75rem; }
            .btn { padding: 10px 14px; font-size: 12px; }
            .btn-sm { padding: 8px 10px; font-size: 11px; }
        }
        @media (max-width: 360px) {
            :root { --cell-size: 34px; }
        }
    </style>
</head>
<body>

<div class="masthead">
    <div style="display:flex;align-items:center;gap:0.875rem">
        <img src="https://www.sostav.ru/images/news/2018/06/09/bk5qmmly_md.jpg" alt="Логотип" style="height:44px;width:auto;object-fit:contain;display:block;flex-shrink:0;">
        <div>
            <div class="masthead-title" id="app-heading">Кроссворд‑новости</div>
            <div class="masthead-sub" id="app-sub">Добавь слова — сетка соберётся сама</div>
        </div>
    </div>
    <div id="mode-badge" class="mode-pill mode-editor">Редактор</div>
</div>

<div class="layout" id="app-layout"></div>

<div class="mobile-clue-bar" id="mobile-clue-bar">
    <div class="mobile-clue-nav">
        <button onclick="mobileNavPrev()" title="Предыдущее слово">‹</button>
        <button onclick="mobileNavNext()" title="Следующее слово">›</button>
    </div>
    <div class="mobile-clue-content">
        <div class="mobile-clue-num" id="mobile-clue-num">—</div>
        <div class="mobile-clue-text" id="mobile-clue-text">Выберите клетку</div>
    </div>
    <button class="mobile-clue-dir-btn" id="mobile-dir-btn" onclick="toggleDirection()">→</button>
</div>

<script>
(function() {
    let appMode = 'editor';
    let editorState = { title: 'Новости дня', words: [], gridData: null };
    let playerState = {
        answers: {}, selected: null, direction: 'across', solved: {},
        timerInterval: null, startTime: null, elapsedSeconds: 0, gameOver: false,
        hintCells: {}, realSolvedBeforeSurrender: 0
    };
    let _playerDataRef = null;

    const el = id => document.getElementById(id);
    const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const isMobile = () => window.innerWidth <= 700 || ('ontouchstart' in window);

    function serialize(data) {
        const obj = { t:data.title, w:data.words.map(w=>({w:w.word,c:w.clue,h:w.hint||''})),
            p:data.gridData.placedWords.map(pw=>({i:pw.wordIndex,r:pw.startRow,o:pw.startCol,d:pw.direction==='across'?'a':'d',n:pw.number})),
            g:{rs:data.gridData.rows,cs:data.gridData.cols,cl:data.gridData.cells,cn:data.gridData.cellNumbers} };
        return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    }
    function deserialize(str) {
        const obj = JSON.parse(decodeURIComponent(escape(atob(str))));
        const words = obj.w.map(w=>({word:w.w,clue:w.c,hint:w.h||''}));
        return { title:obj.t, words,
            gridData: { rows:obj.g.rs, cols:obj.g.cs, cells:obj.g.cl, cellNumbers:obj.g.cn,
                placedWords: obj.p.map(p=>({wordIndex:p.i,startRow:p.r,startCol:p.o,direction:p.d==='a'?'across':'down',number:p.n,word:words[p.i].word})) } };
    }

    function getDataFromUrl() {
        // Поддержка старых ссылок с ?data= или #hash
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        if (dataParam) { try { return deserialize(dataParam); } catch(e) { console.warn(e); return null; } }
        const hash = window.location.hash.slice(1);
        if (hash) { try { return deserialize(hash); } catch(e) { console.warn(e); return null; } }
        return null;
    }

    async function loadFromId(id) {
        try {
            const res = await fetch(`/api/load/${id}`);
            if (!res.ok) throw new Error('Not found');
            return await res.json();
        } catch(e) {
            alert('Не удалось загрузить кроссворд. Ссылка устарела или недействительна.');
            return null;
        }
    }

    function getShareableUrl(data) {
        const base = window.location.origin + window.location.pathname;
        return base + '?data=' + encodeURIComponent(serialize(data));
    }

    function clearUrlAndGoToEditor() {
        window.history.pushState({}, document.title, window.location.origin + window.location.pathname);
        backToEditor();
    }

    function getWordCellsByPlacement(pw, gd) {
        const cells = [];
        for (let i=0; i<pw.word.length; i++) {
            const r = pw.direction==='across' ? pw.startRow : pw.startRow + i;
            const c = pw.direction==='across' ? pw.startCol + i : pw.startCol;
            cells.push([r, c]);
        }
        return cells;
    }

    function calcGridScore(cells, placedCount, totalWords) {
        const keys = Object.keys(cells);
        if (!keys.length) return Infinity;
        const rows = keys.map(k=>+k.split(',')[0]);
        const cols = keys.map(k=>+k.split(',')[1]);
        const w = Math.max(...cols) - Math.min(...cols) + 1;
        const h = Math.max(...rows) - Math.min(...rows) + 1;
        const unconnected = totalWords - placedCount;
        return w * h + unconnected * 50;
    }

    function tryArrange(sorted, firstDir) {
        const placedWords = [], cells = {};
        const first = sorted[0];
        if (firstDir === 'across') {
            for (let c=0; c<first.word.length; c++) cells[`0,${c}`] = first.word[c];
            placedWords.push({wordIndex:first._origIndex, startRow:0, startCol:0, direction:'across', word:first.word});
        } else {
            for (let r=0; r<first.word.length; r++) cells[`${r},0`] = first.word[r];
            placedWords.push({wordIndex:first._origIndex, startRow:0, startCol:0, direction:'down', word:first.word});
        }

        for (let i=1; i<sorted.length; i++) {
            const curr = sorted[i], currWord = curr.word;
            let best = null, bestScore = -Infinity;

            for (const pw of placedWords) {
                for (let pi=0; pi<pw.word.length; pi++) {
                    for (let ci=0; ci<currWord.length; ci++) {
                        if (currWord[ci].toUpperCase() !== pw.word[pi].toUpperCase()) continue;
                        let newStartRow, newStartCol, newDir;
                        if (pw.direction === 'across') {
                            newDir='down'; newStartRow = pw.startRow - ci; newStartCol = pw.startCol + pi;
                        } else {
                            newDir='across'; newStartRow = pw.startRow + pi; newStartCol = pw.startCol - ci;
                        }

                        const cand = {}; let valid = true;
                        for (let c2=0; c2<currWord.length; c2++) {
                            const r = newDir==='across' ? newStartRow : newStartRow + c2;
                            const c = newDir==='across' ? newStartCol + c2 : newStartCol;
                            const key = `${r},${c}`;
                            if (cells[key] && cells[key].toUpperCase() !== currWord[c2].toUpperCase()) { valid=false; break; }
                            cand[key] = currWord[c2];
                        }
                        if (!valid) continue;

                        // Проверка: параллельные клетки не должны касаться других слов (кроме точки пересечения)
                        let tooClose = false;
                        for (let c2=0; c2<currWord.length && !tooClose; c2++) {
                            const cr = newDir==='across' ? newStartRow : newStartRow + c2;
                            const cc2 = newDir==='across' ? newStartCol + c2 : newStartCol;
                            const isIntersection = cells[`${cr},${cc2}`] !== undefined;
                            if (!isIntersection) {
                                const sides = newDir==='across' ? [[cr-1,cc2],[cr+1,cc2]] : [[cr,cc2-1],[cr,cc2+1]];
                                for (const [sr,sc2] of sides) {
                                    if (cells[`${sr},${sc2}`] && !cand[`${sr},${sc2}`]) { tooClose=true; break; }
                                }
                            }
                        }
                        if (tooClose) continue;
                            if (cells[`${newStartRow},${newStartCol-1}`] || cells[`${newStartRow},${newStartCol+currWord.length}`]) valid=false;
                        } else {
                            if (cells[`${newStartRow-1},${newStartCol}`] || cells[`${newStartRow+currWord.length},${newStartCol}`]) valid=false;
                        }
                        if (!valid) continue;

                        let intersections = 0;
                        for (const k of Object.keys(cand)) { if (cells[k]) intersections++; }
                        if (intersections === 0) continue;

                        const centerScore = -(Math.abs(pi - pw.word.length/2) + Math.abs(ci - currWord.length/2));
                        const tempCells = {...cells, ...cand};
                        const tKeys = Object.keys(tempCells);
                        const tRows = tKeys.map(k=>+k.split(',')[0]);
                        const tCols = tKeys.map(k=>+k.split(',')[1]);
                        const area = (Math.max(...tCols)-Math.min(...tCols)+1) * (Math.max(...tRows)-Math.min(...tRows)+1);
                        const score = centerScore * 2 + intersections * 10 - area * 0.5;

                        if (score > bestScore) { bestScore = score; best = { startRow:newStartRow, startCol:newStartCol, direction:newDir, cells:cand }; }
                    }
                }
            }

            if (best) {
                Object.assign(cells, best.cells);
                placedWords.push({wordIndex:curr._origIndex, startRow:best.startRow, startCol:best.startCol, direction:best.direction, word:currWord});
            } else {
                const keys = Object.keys(cells);
                const maxRow = keys.length ? Math.max(...keys.map(k=>+k.split(',')[0])) : 0;
                const newRow = maxRow + 2, newCol = 0;
                for (let ci=0; ci<currWord.length; ci++) { cells[`${newRow},${newCol+ci}`] = currWord[ci]; }
                placedWords.push({wordIndex:curr._origIndex, startRow:newRow, startCol:newCol, direction:'across', word:currWord, unconnected:true});
            }
        }

        return { cells, placedWords };
    }

    function arrangeGrid(words) {
        if (!words.length) return null;
        const sorted = words.map((w,i)=>({...w, _origIndex:i}));
        sorted.sort((a,b)=>b.word.length - a.word.length);

        const attempts = [
            () => tryArrange(sorted, 'across'),
            () => tryArrange(sorted, 'down'),
        ];

        let bestResult = null;
        let bestScore = Infinity;
        for (const attempt of attempts) {
            const result = attempt();
            if (!result) continue;
            const score = calcGridScore(result.cells, result.placedWords.length, sorted.length);
            if (score < bestScore) { bestScore = score; bestResult = result; }
        }
        return bestResult ? finalizeGrid(bestResult) : null;
    }

    function finalizeGrid({ cells, placedWords }) {
        const keys = Object.keys(cells);
        const rows = keys.map(k=>+k.split(',')[0]), cols = keys.map(k=>+k.split(',')[1]);
        const minRow = Math.min(...rows), maxRow = Math.max(...rows);
        const minCol = Math.min(...cols), maxCol = Math.max(...cols);

        const normCells = {};
        for (const [k,v] of Object.entries(cells)) {
            const [r,c]=k.split(',').map(Number);
            normCells[`${r-minRow},${c-minCol}`] = v;
        }
        const normPlaced = placedWords.map(pw=>({...pw, startRow:pw.startRow-minRow, startCol:pw.startCol-minCol}));

        const cellNums = {}, starts = [];
        for (const pw of normPlaced) {
            const key = `${pw.startRow},${pw.startCol}`;
            if (!starts.find(s=>s.key===key)) starts.push({key, row:pw.startRow, col:pw.startCol});
        }
        starts.sort((a,b)=>a.row-b.row||a.col-b.col);
        starts.forEach((sc,idx)=> cellNums[sc.key] = idx+1);
        normPlaced.forEach(pw=> pw.number = cellNums[`${pw.startRow},${pw.startCol}`]||0);

        return { rows:maxRow-minRow+1, cols:maxCol-minCol+1, cells:normCells, placedWords:normPlaced, cellNumbers:cellNums };
    }

    function parseImportText(text) {
        const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l && !l.startsWith('#'));
        const added = [], skipped = [], errors = [];
        lines.forEach((line, idx) => {
            let parts;
            if(line.includes(';')) parts = line.split(';');
            else if(line.includes('\t')) parts = line.split('\t');
            else if(line.includes(',')) parts = line.split(',');
            else { errors.push(`Строка ${idx+1}: не найден разделитель`); return; }

            const word = (parts[0]||'').trim().toUpperCase().replace(/\s/g,'');
            const clue = (parts[1]||'').trim();
            const hint = (parts[2]||'').trim();

            if(!word) { errors.push(`Строка ${idx+1}: пустое слово`); return; }
            if(word.length < 2) { errors.push(`Строка ${idx+1}: слово «${word}» слишком короткое`); return; }
            if(!clue) { errors.push(`Строка ${idx+1}: нет описания для «${word}»`); return; }
            if(checkDuplicateInList(word, editorState.words)) { skipped.push(word); return; }

            editorState.words.push({word, clue, hint: hint||''});
            added.push(word);
        });
        return {added, skipped, errors};
    }

    function checkDuplicateInList(word, list) {
        return list.some(w => w.word.toUpperCase() === word.toUpperCase());
    }

    function importFromText(text, resultElId) {
        const res = parseImportText(text);
        const resEl = document.getElementById(resultElId);
        if(res.added.length === 0 && res.errors.length > 0) {
            if(resEl) { resEl.className='import-result err'; resEl.textContent = 'Ошибки: ' + res.errors.join('; '); }
            return;
        }
        editorState.gridData = null;
        let msg = `Добавлено: ${res.added.length} слов`;
        if(res.skipped.length) msg += ` · Пропущено дублей: ${res.skipped.length}`;
        if(res.errors.length) msg += ` · Ошибок: ${res.errors.length}`;
        if(resEl) { resEl.className='import-result ok'; resEl.textContent = '✓ ' + msg; }
        renderEditor();
    }

    function handleImportFile(file) {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = e => { importFromText(e.target.result, 'import-file-result'); };
        reader.readAsText(file, 'UTF-8');
    }

    }

    function checkDuplicate(word) {
        const clean = word.trim().toUpperCase().replace(/\s/g,'');
        return editorState.words.some(w => w.word.toUpperCase() === clean);
    }

    function addWord() {
        const w = el('word-input')?.value.trim().toUpperCase();
        const c = el('clue-input')?.value.trim();
        const h = el('hint-input')?.value.trim();
        if(!w||!c) return alert('Введите слово и описание');
        const clean = w.replace(/\s/g,'');
        if(clean.length<2) return alert('Минимум 2 буквы');
        if(checkDuplicate(clean)) return alert(`Слово «${clean}» уже есть в списке`);
        editorState.words.push({word:clean, clue:c, hint:h||''});
        editorState.gridData = null;
        renderEditor();
    }

        editorState.words.splice(i,1);
        editorState.gridData = null;
        renderEditor();
    }

    function saveInlineEdit(i) {
        const newWord = (el(`ie-word-${i}`)?.value||'').trim().toUpperCase().replace(/\s/g,'');
        const newClue = (el(`ie-clue-${i}`)?.value||'').trim();

        if(!newWord||!newClue) return alert('Заполните слово и описание');
        if(newWord.length<2) return alert('Минимум 2 буквы');
        const isDup = editorState.words.some((w,idx) => idx!==i && w.word.toUpperCase()===newWord);
        if(isDup) return alert(`Слово «${newWord}» уже есть в списке`);
        editorState.words[i] = {word:newWord, clue:newClue, hint:newHint};
        editorState.gridData = null;
        renderEditor();

        if(!editorState.words.length) return alert('Добавьте слова');

    async function generateLink() {
        if(!editorState.gridData) return alert('Соберите кроссворд');
        const btn = document.querySelector('[onclick="generateLink()"]');
        if(btn) { btn.disabled = true; btn.textContent = 'Сохраняю...'; }
        try {
            const res = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(editorState)
            });
            if(!res.ok) throw new Error('Server error');
            const { id } = await res.json();
            const url = `${location.origin}/?id=${id}`;
            el('link-output').style.display='';
            el('link-text').textContent = url;
        } catch(e) {
            alert('Не удалось сохранить кроссворд. Попробуйте ещё раз.');
        } finally {
            if(btn) { btn.disabled = false; btn.textContent = 'Создать ссылку'; }
        }
    }
    function copyLink(boxEl) {
        navigator.clipboard?.writeText(boxEl.textContent).then(()=>{
            const note = el('link-note');
            if(note) { note.textContent = '✓ Скопировано!'; setTimeout(()=>{ note.textContent='Нажми чтобы скопировать'; }, 2000); }
        });
    }

        gridEl.className='grid-container';
        gridEl.style.gridTemplateColumns = `repeat(${gd.cols}, var(--cell-size))`;

        for(let r=0;r<gd.rows;r++) for(let c=0;c<gd.cols;c++) {
            const key=`${r},${c}`, letter=gd.cells[key];
            const cell = document.createElement('div');
            cell.className='cell'+(letter?'':' black'); cell.id=`cell-${r}-${c}`;
            if(letter) {
                if(gd.cellNumbers[key]) {
                    const s=document.createElement('span'); s.className='cell-num'; s.textContent=gd.cellNumbers[key]; cell.appendChild(s);
                }
                const inp = document.createElement('input');
                inp.type='text'; inp.maxLength=2;
                inp.setAttribute('autocomplete','off'); inp.setAttribute('autocorrect','off');
                inp.setAttribute('autocapitalize','characters'); inp.setAttribute('spellcheck','false');
                inp.value = (playerState.answers[key]||'').toUpperCase();

                cell.addEventListener('touchstart', e => {
                    e.preventDefault();
                    selectCell(r,c,data);
                    inp.focus();
                    setTimeout(() => scrollToCell(r,c), 50);
                }, {passive:false});
                inp.addEventListener('mousedown', e => {
                    e.preventDefault();
                    selectCell(r,c,data);
                    inp.focus();
                });
                inp.addEventListener('keydown', e => handleKey(e,r,c,data));
                inp.addEventListener('input', e => {
                    if(playerState.gameOver) return;
                    const v = e.target.value.replace(/[^а-яёa-z]/gi,'').toUpperCase().slice(-1);
                    e.target.value = v;
                    playerState.answers[key] = v;
                    if(!playerState.startTime) startTimer();
                    if(v) {
                        checkWordAtCell(r, c, data);
                        moveNextSkipSolved(r, c, data);
                    }
                });
                cell.appendChild(inp);
            }
            gridEl.appendChild(cell);
        }
        el('grid-scroll-container').appendChild(gridEl);

        const cluesSec = document.createElement('div');
        cluesSec.className='section';
        cluesSec.innerHTML = `<div class="section-label">Вопросы</div>
            <div class="clues-cols">
                <div><div class="clues-dir-title">→ По горизонтали</div><div id="clues-across"></div></div>
                <div><div class="clues-dir-title">↓ По вертикали</div><div id="clues-down"></div></div>
            </div>`;
        lay.appendChild(cluesSec);
        renderClueList(across, 'clues-across', data);
        renderClueList(down, 'clues-down', data);

        if(isMobile()) {
            el('mobile-clue-bar').classList.add('visible');
            document.body.classList.add('mobile-bar-visible');
            el('key-hint').style.display='none';
        }
    }

    function renderClueList(clues, containerId, data) {
        const cont = el(containerId);
        clues.forEach(cl => {
            const div = document.createElement('div');
            div.className='clue-player'; div.id=`cp-${cl.num}-${cl.dir}`;
            div.innerHTML = `<span class="clue-player-num">${cl.num}</span><span class="clue-player-text">${esc(cl.clue)}${cl.hint?`<br><a href="${esc(cl.hint)}" target="_blank" class="clue-hint-link">📰 Источник</a>`:''}</span>`;
            div.addEventListener('click', () => {
                playerState.direction=cl.dir;
                playerState.selected=`${cl.r},${cl.c}`;
                highlightWord(cl.r,cl.c,cl.dir,data);
                showActiveClue(cl.r,cl.c,cl.dir,data);
                updateMobileClueBar(cl.r,cl.c,cl.dir,data);
                const inp = document.querySelector(`#cell-${cl.r}-${cl.c} input`);
                if(inp) { inp.focus(); scrollToCell(cl.r,cl.c); }
            });
            cont.appendChild(div);
        });
    }

    function revealHintLetter() {
        const data = window._playerData; if(!data) return;
        if(playerState.gameOver) return;
        if(!playerState.selected) return alert('Выберите клетку для подсказки');

        const [r,c] = playerState.selected.split(',').map(Number);
        const key = `${r},${c}`;
        const gd = data.gridData;
        const correctLetter = gd.cells[key];
        if(!correctLetter) return;

        if((playerState.answers[key]||'').toUpperCase() === correctLetter.toUpperCase()) {
            alert('Эта буква уже верная!'); return;
        }

        playerState.answers[key] = correctLetter.toUpperCase();
        playerState.hintCells[key] = true;
        const inp = document.querySelector(`#cell-${r}-${c} input`);
        if(inp) inp.value = correctLetter.toUpperCase();
        const cell = el(`cell-${r}-${c}`);
        if(cell) { cell.classList.remove('wrong-cell','highlight','active-cell'); cell.classList.add('hint-cell'); }

        if(!playerState.startTime) startTimer();
        playerState.elapsedSeconds += 30;
        playerState.startTime = Date.now() - playerState.elapsedSeconds * 1000;

        const timerEl = el('timer-display');
        if(timerEl) { timerEl.classList.add('penalty-flash'); setTimeout(()=>timerEl.classList.remove('penalty-flash'), 700); }

        moveNext(r,c,data);
    }

    function selectCell(r,c,data) {
        if(playerState.gameOver) return;
        const key=`${r},${c}`;
        if(playerState.selected===key) {
            playerState.direction = playerState.direction==='across'?'down':'across';
        }
        playerState.selected=key;
        highlightWord(r,c,playerState.direction,data);
        showActiveClue(r,c,playerState.direction,data);
        updateMobileClueBar(r,c,playerState.direction,data);
        const dirInd = el('dir-indicator');
        if(dirInd) dirInd.textContent = playerState.direction==='across'?'→ (горизонталь)':'↓ (вертикаль)';
    }

    function toggleDirection() {
        if(!playerState.selected || playerState.gameOver) return;
        const [r,c] = playerState.selected.split(',').map(Number);
        playerState.direction = playerState.direction==='across'?'down':'across';
        const data = window._playerData; if(!data) return;
        highlightWord(r,c,playerState.direction,data);
        showActiveClue(r,c,playerState.direction,data);
        updateMobileClueBar(r,c,playerState.direction,data);
        const dirInd = el('dir-indicator');
        if(dirInd) dirInd.textContent = playerState.direction==='across'?'→ (горизонталь)':'↓ (вертикаль)';
    }

    function highlightWord(r,c,dir,data) {
        document.querySelectorAll('.cell').forEach(cell=>{
            if(!cell.classList.contains('hint-cell') && !cell.classList.contains('correct-cell'))
                cell.classList.remove('highlight','active-cell');
            else cell.classList.remove('highlight','active-cell');
        });
        document.querySelectorAll('.clue-player').forEach(d=>d.classList.remove('active-clue'));
        const gd=data.gridData;
        const pw = gd.placedWords.find(p => {
            const cells = getWordCellsByPlacement(p, gd);
            return cells.some(([rr,cc])=>rr===r&&cc===c) && p.direction===dir;
        });
        if(pw) {
            const cells = getWordCellsByPlacement(pw, gd);
            cells.forEach(([rr,cc])=> {
                const cell=el(`cell-${rr}-${cc}`);
                if(cell && !cell.classList.contains('correct-cell') && !cell.classList.contains('hint-cell'))
                    cell.classList.add('highlight');
            });
            const activeCell = el(`cell-${r}-${c}`);
            if(activeCell) { activeCell.classList.remove('highlight'); activeCell.classList.add('active-cell'); }
            const clueDiv = el(`cp-${pw.number}-${pw.direction}`);
            if(clueDiv) {
                clueDiv.classList.add('active-clue');
                clueDiv.scrollIntoView({behavior:'smooth', block:'nearest'});
            }
        }
    }

    function showActiveClue(r,c,dir,data) {
        const gd=data.gridData;
        const pw = gd.placedWords.find(p => {
            const cells = getWordCellsByPlacement(p, gd);
            return cells.some(([rr,cc])=>rr===r&&cc===c) && p.direction===dir;
        });
        const box=el('active-box');
        if(pw && box) {
            const w=data.words[pw.wordIndex];
            box.innerHTML = `<div class="num">#${pw.number} ${pw.direction==='across'?'→':'↓'} — ${pw.word.length} букв</div>
                <div>${esc(w.clue)}</div>
                ${w.hint?`<div class="hint-visible"><a href="${esc(w.hint)}" target="_blank" class="clue-hint-link">📰 Открыть источник</a></div>`:''}`;
        }
    }

    function updateMobileClueBar(r,c,dir,data) {
        if(!isMobile()) return;
        const gd=data.gridData;
        const pw = gd.placedWords.find(p => {
            const cells = getWordCellsByPlacement(p, gd);
            return cells.some(([rr,cc])=>rr===r&&cc===c) && p.direction===dir;
        });
        const numEl = el('mobile-clue-num'), textEl = el('mobile-clue-text'), dirBtn = el('mobile-dir-btn');
        if(pw) {
            const w = data.words[pw.wordIndex];
            if(numEl) numEl.textContent = `#${pw.number} ${dir==='across'?'→ горизонталь':'↓ вертикаль'} · ${pw.word.length} букв`;
            if(textEl) textEl.textContent = w.clue;
        } else {
            if(numEl) numEl.textContent = '—';
            if(textEl) textEl.textContent = 'Выберите клетку';
        }
        if(dirBtn) dirBtn.textContent = dir==='across'?'→':'↓';
    }

    function mobileNavNext() { mobileNavStep(1); }
    function mobileNavPrev() { mobileNavStep(-1); }
    function mobileNavStep(step) {
        const data = window._playerData; if(!data) return;
        const gd = data.gridData;
        const allWords = [...gd.placedWords].sort((a,b)=>a.number-b.number || (a.direction==='across'?-1:1));
        if(!playerState.selected) {
            const pw = allWords[0];
            if(pw) { playerState.selected=`${pw.startRow},${pw.startCol}`; playerState.direction=pw.direction; }
        }
        const [r,c] = playerState.selected.split(',').map(Number);
        const curPw = gd.placedWords.find(p => {
            const cells = getWordCellsByPlacement(p,gd);
            return cells.some(([rr,cc])=>rr===r&&cc===c) && p.direction===playerState.direction;
        });
        const curIdx = curPw ? allWords.findIndex(w=>w.number===curPw.number&&w.direction===curPw.direction) : -1;
        const nextIdx = ((curIdx+step)+allWords.length) % allWords.length;
        const nextPw = allWords[nextIdx];
        if(nextPw) {
            playerState.direction = nextPw.direction;
            playerState.selected = `${nextPw.startRow},${nextPw.startCol}`;
            highlightWord(nextPw.startRow,nextPw.startCol,nextPw.direction,data);
            showActiveClue(nextPw.startRow,nextPw.startCol,nextPw.direction,data);
            updateMobileClueBar(nextPw.startRow,nextPw.startCol,nextPw.direction,data);
            const inp = document.querySelector(`#cell-${nextPw.startRow}-${nextPw.startCol} input`);
            if(inp) { inp.focus(); scrollToCell(nextPw.startRow,nextPw.startCol); }
        }
    }

    function scrollToCell(r,c) {
        const cell = el(`cell-${r}-${c}`);
        if(cell) cell.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
    }

    function handleKey(e,r,c,data) {
        if(playerState.gameOver) return;
        if (e.key==='ArrowRight') { e.preventDefault(); playerState.direction='across'; moveDir(r,c,0,1,data); }
        else if (e.key==='ArrowLeft') { e.preventDefault(); playerState.direction='across'; moveDir(r,c,0,-1,data); }
        else if (e.key==='ArrowDown') { e.preventDefault(); playerState.direction='down'; moveDir(r,c,1,0,data); }
        else if (e.key==='ArrowUp') { e.preventDefault(); playerState.direction='down'; moveDir(r,c,-1,0,data); }
        else if (e.key==='Backspace') {
            const inp = document.querySelector(`#cell-${r}-${c} input`);
            if(inp && !inp.value) {
                e.preventDefault();
                if(playerState.direction==='across') moveDir(r,c,0,-1,data);
                else moveDir(r,c,-1,0,data);
            }
        }
    }

    function moveDir(r,c,dr,dc,data) {
        const gd=data.gridData;
        const nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<gd.rows&&nc>=0&&nc<gd.cols&&gd.cells[`${nr},${nc}`]) {
            playerState.selected=`${nr},${nc}`;
            highlightWord(nr,nc,playerState.direction,data);
            const inp = document.querySelector(`#cell-${nr}-${nc} input`);
            if(inp) { inp.focus(); scrollToCell(nr,nc); }
            showActiveClue(nr,nc,playerState.direction,data);
            updateMobileClueBar(nr,nc,playerState.direction,data);
            const dirInd = el('dir-indicator');
            if(dirInd) dirInd.textContent = playerState.direction==='across'?'→ (горизонталь)':'↓ (вертикаль)';
        }
    }

    function moveNext(r,c,data) {
        if(playerState.direction==='across') moveDir(r,c,0,1,data);
        else moveDir(r,c,1,0,data);
    }

    function startTimer() {
        if(playerState.timerInterval) return;
        playerState.startTime = Date.now() - playerState.elapsedSeconds*1000;
        playerState.timerInterval = setInterval(()=>{
            const elapsed = Math.floor((Date.now()-playerState.startTime)/1000);
            playerState.elapsedSeconds = elapsed;
            const d = el('timer-display');
            if(d) d.textContent = new Date(elapsed*1000).toISOString().substr(14,5);
        }, 300);
    }
    function stopTimer() {
        if(playerState.timerInterval) { clearInterval(playerState.timerInterval); playerState.timerInterval=null; }
    }

    function checkWordAtCell(r, c, data) {
        const gd = data.gridData;
        gd.placedWords.forEach(pw => {
            const cells = getWordCellsByPlacement(pw, gd);
            if (!cells.some(([rr,cc]) => rr===r && cc===c)) return;
            const entered = cells.map(([rr,cc]) => (playerState.answers[`${rr},${cc}`]||'').toUpperCase()).join('');
            if (entered.length < pw.word.length) return;
            const correct = entered === pw.word.toUpperCase();
            const key2 = `${pw.number}-${pw.direction}`;
            if (correct && !playerState.solved[key2]) {
                playerState.solved[key2] = true;
                cells.forEach(([rr,cc]) => {
                    const cell = el(`cell-${rr}-${cc}`);
                    if (cell) { cell.classList.remove('wrong-cell','highlight','active-cell','hint-cell'); cell.classList.add('correct-cell'); }
                });
                const cp = el(`cp-${pw.number}-${pw.direction}`); if(cp) cp.classList.add('solved-clue');
                updateProgress();
                checkVictory();
            }
        });
    }

    function moveNextSkipSolved(r, c, data) {
        const gd = data.gridData;
        const dr = playerState.direction==='across' ? 0 : 1;
        const dc = playerState.direction==='across' ? 1 : 0;
        let nr = r + dr, nc = c + dc;
        while (nr>=0 && nr<gd.rows && nc>=0 && nc<gd.cols && gd.cells[`${nr},${nc}`]) {
            const cellEl = el(`cell-${nr}-${nc}`);
            if (cellEl && cellEl.classList.contains('correct-cell')) {
                nr += dr; nc += dc;
            } else {
                playerState.selected = `${nr},${nc}`;
                highlightWord(nr, nc, playerState.direction, data);
                const inp = document.querySelector(`#cell-${nr}-${nc} input`);
                if(inp) { inp.focus(); scrollToCell(nr, nc); }
                showActiveClue(nr, nc, playerState.direction, data);
                updateMobileClueBar(nr, nc, playerState.direction, data);
                const dirInd = el('dir-indicator');
                if(dirInd) dirInd.textContent = playerState.direction==='across'?'→ (горизонталь)':'↓ (вертикаль)';
                return;
            }
        }
        moveNext(r, c, data);
    }

    function checkAll() {
        const data=window._playerData; if(!data) return;
        const gd=data.gridData;
        gd.placedWords.forEach(pw => {
            const cells = getWordCellsByPlacement(pw, gd);
            const entered = cells.map(([r,c])=> (playerState.answers[`${r},${c}`]||'').toUpperCase()).join('');
            const correct = entered === pw.word.toUpperCase();
            const key = `${pw.number}-${pw.direction}`;
            if(correct) {
                playerState.solved[key]=true;
                cells.forEach(([r,c])=> {
                    const cell=el(`cell-${r}-${c}`);
                    if(cell) { cell.classList.remove('wrong-cell','highlight','active-cell','hint-cell'); cell.classList.add('correct-cell'); }
                });
                const cp = el(`cp-${pw.number}-${pw.direction}`); if(cp) cp.classList.add('solved-clue');
            } else if(entered.replace(/\s/g,'').length>0) {
                cells.forEach(([r,c])=> {
                    const cell=el(`cell-${r}-${c}`);
                    if(cell && !cell.classList.contains('correct-cell') && !cell.classList.contains('hint-cell'))
                        cell.classList.add('wrong-cell');
                });
            }
        });
        updateProgress();
        checkVictory();
    }

    function clearAll() {
        const data = window._playerData;
        if (!data) return;
        playerState.answers={}; playerState.solved={}; playerState.hintCells={}; stopTimer();
        playerState.startTime=null; playerState.elapsedSeconds=0;
        playerState.gameOver = false;
        const td = el('timer-display'); if(td) td.textContent='00:00';
        document.querySelectorAll('.cell input').forEach(inp=>inp.value='');
        document.querySelectorAll('.cell').forEach(c=>c.classList.remove('correct-cell','wrong-cell','highlight','active-cell','hint-cell'));
        document.querySelectorAll('.clue-player').forEach(d=>d.classList.remove('solved-clue','active-clue'));
        const cong = el('congrats'); if(cong) cong.style.display='none';
        const pf = el('prog-fill'); if(pf) pf.style.width='0%';
        const pl = el('prog-label'); if(pl) pl.textContent=`0 / ${data.gridData.placedWords.length}`;
    }

    function surrender() {
        const data=window._playerData; if(!data) return;
        stopTimer();
        // Запоминаем реальное количество решённых слов
        playerState.realSolvedBeforeSurrender = Object.keys(playerState.solved).length;
        playerState.gameOver=true;
        const gd=data.gridData;
        gd.placedWords.forEach(pw => {
            const cells = getWordCellsByPlacement(pw, gd);
            cells.forEach(([r,c],i)=>{
                const inp=document.querySelector(`#cell-${r}-${c} input`);
                if(inp) { inp.value=pw.word[i]; playerState.answers[`${r},${c}`]=pw.word[i]; }
            });
            playerState.solved[`${pw.number}-${pw.direction}`]=true;
        });
        updateProgress();
        showVictoryScreen(true, playerState.realSolvedBeforeSurrender);
    }

    function updateProgress() {
        const total = window._playerData.gridData.placedWords.length;
        const done = Object.keys(playerState.solved).length;
        const pf = el('prog-fill'); if(pf) pf.style.width = total? (done/total*100)+'%' : '0%';
        const pl = el('prog-label'); if(pl) pl.textContent = `${done} / ${total}`;
    }

    function checkVictory() {
        const total = window._playerData.gridData.placedWords.length;
        const done = Object.keys(playerState.solved).length;
        if(done>=total && total>0 && !playerState.gameOver) { stopTimer(); playerState.gameOver=true; showVictoryScreen(false); }
    }

    function showVictoryScreen(surrendered, realSolvedCount) {
        const data = window._playerData;
        const timeStr = el('timer-display')?.textContent || '??:??';
        const hintsUsed = Object.keys(playerState.hintCells).length;
        const totalWords = data.gridData.placedWords.length;
        const solvedWords = surrendered ? (realSolvedCount !== undefined ? realSolvedCount : Object.keys(playerState.solved).length) : Object.keys(playerState.solved).length;
        const box = el('congrats'); if(!box) return;
        box.style.display='block';

        let wordList = '';
        data.gridData.placedWords.forEach(pw => {
            const w = data.words[pw.wordIndex];
            wordList += `<li><strong>${pw.number}${pw.direction==='across'?'→':'↓'}</strong> ${pw.word} — ${esc(w.clue)}</li>`;
        });

        box.innerHTML = `
            <h2>${surrendered ? 'Вы сдались' : '🎉 Поздравляем!'}</h2>
            <p>Время: ${timeStr}${hintsUsed ? ` · Подсказок: ${hintsUsed}` : ''}<br>Решено слов: ${solvedWords} из ${totalWords}${surrendered ? ' (сдался)' : ''}</p>
            <ul>${wordList}</ul>
            <button class="btn btn-share" onclick="shareResult(${surrendered})">📷 Поделиться результатом</button>
            <div id="share-card"></div>`;

        box.scrollIntoView({behavior:'smooth', block:'start'});
    }

    function buildShareCard(surrendered) {
        const data = window._playerData;
        const timeStr = el('timer-display')?.textContent || '??:??';
        const hintsUsed = Object.keys(playerState.hintCells).length;
        const totalWords = data.gridData.placedWords.length;
        const solvedWords = surrendered ? (playerState.realSolvedBeforeSurrender || 0) : Object.keys(playerState.solved).length;
        const gd = data.gridData;
        const title = data.title || 'Кроссворд';
        const today = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});

        let gridHTML = `<div class="share-grid" style="grid-template-columns: repeat(${gd.cols}, 22px)">`;
        for(let r=0;r<gd.rows;r++) for(let c=0;c<gd.cols;c++) {
            const key=`${r},${c}`, letter=gd.cells[key];
            if(!letter) { gridHTML += `<div class="share-cell s-black"></div>`; continue; }
            const num = gd.cellNumbers[key] ? `<span class="share-cell-num">${gd.cellNumbers[key]}</span>` : '';
            gridHTML += `<div class="share-cell s-letter">${num}${letter}</div>`;
        }
        gridHTML += '</div>';

        const card = el('share-card');
        card.innerHTML = `
            <div class="share-card-header">
                <div class="share-card-title">${esc(title)}</div>
                <div class="share-card-sub">Кроссворд-новости · ${today}</div>
            </div>
            <div class="share-card-stats">
                <div>
                    <div class="share-stat-label">Время</div>
                    <div class="share-stat-val">${timeStr}</div>
                </div>
                <div>
                    <div class="share-stat-label">Решено</div>
                    <div class="share-stat-val">${solvedWords} / ${totalWords}${surrendered ? ' (сдался)' : ''}</div>
                </div>
                ${hintsUsed ? `<div><div class="share-stat-label">Подсказок</div><div class="share-stat-val">${hintsUsed}</div></div>` : ''}
            </div>
            <div class="share-grid-wrap">${gridHTML}</div>
            <div class="share-card-footer">${today}</div>`;
        return card;
    }

    async function shareResult(surrendered) {
        const btn = document.querySelector('.btn-share');
        if (btn) { btn.disabled = true; btn.textContent = 'Готовлю...'; }

        const card = buildShareCard(surrendered);
        card.classList.add('visible');
        await new Promise(r => setTimeout(r, 150));

        try {
            const canvas = await html2canvas(card, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#fffef9',
                logging: false
            });
            card.classList.remove('visible');

            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const url = URL.createObjectURL(blob);

            // Всегда показываем превью с кнопкой скачать
            const overlay = document.createElement('div');
            overlay.id = 'img-modal';
            overlay.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999';
            
            const img = document.createElement('img');
            img.src = url;
            img.style = 'max-width:90%;max-height:70%;box-shadow:0 0 20px rgba(0,0,0,0.5);border-radius:4px;margin-bottom:20px';
            img.onclick = (e) => e.stopPropagation();

            const btnRow = document.createElement('div');
            btnRow.style = 'display:flex;gap:12px';

            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = 'Скачать';
            downloadBtn.style = 'padding:10px 24px;font-family:Georgia,serif;font-size:16px;background:#25a244;color:white;border:none;border-radius:4px;cursor:pointer';
            downloadBtn.onclick = (e) => {
                e.stopPropagation();
                const a = document.createElement('a');
                a.href = url;
                a.download = 'crossword-result.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const closeBtn = document.createElement('button');
            closeBtn.textContent = 'Закрыть';
            closeBtn.style = 'padding:10px 24px;font-family:Georgia,serif;font-size:16px;background:#5a5650;color:white;border:none;border-radius:4px;cursor:pointer';
            closeBtn.onclick = (e) => {
                e.stopPropagation();
                overlay.remove();
                URL.revokeObjectURL(url);
            };

            const hint = document.createElement('div');
            hint.style = 'color:white;font-family:Georgia,serif;font-size:13px;margin-top:16px;text-align:center';
            hint.textContent = isMobile() ? 'Или удерживайте изображение, чтобы сохранить' : '';

            btnRow.appendChild(downloadBtn);
            btnRow.appendChild(closeBtn);
            overlay.appendChild(img);
            overlay.appendChild(btnRow);
            overlay.appendChild(hint);
            overlay.onclick = () => {
                overlay.remove();
                URL.revokeObjectURL(url);
            };
            document.body.appendChild(overlay);

        } catch (err) {
            alert('Не удалось создать скриншот: ' + err.message);
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = '📷 Поделиться результатом'; }
        }
    }

    function backToEditor() {
        stopTimer();
        el('mobile-clue-bar').classList.remove('visible');
        document.body.classList.remove('mobile-bar-visible');
        appMode='editor';
        el('mode-badge').textContent='Редактор'; el('mode-badge').className='mode-pill mode-editor';
        el('app-heading').textContent='Кроссворд‑новости'; el('app-sub').textContent='Добавь слова — сетка соберётся сама';
        renderEditor();
    }

    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) {
            // Показываем лоадер пока грузим с API
            const lay = el('app-layout');
            lay.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--ink2);font-size:14px">Загрузка кроссворда...</div>';
            const data = await loadFromId(id);
            if (data) { window._playerData = data; switchToPlayer(data); }
            else { renderEditor(); }
        } else {
            const dataFromUrl = getDataFromUrl();
            if(dataFromUrl) { window._playerData = dataFromUrl; switchToPlayer(dataFromUrl); }
            else { renderEditor(); }
        }
    }

    function importFromPaste() {
        const text = el('import-paste-area')?.value || '';
        if(!text.trim()) return;
        importFromText(text, 'import-paste-result');
    }

    window.addWord = addWord;
    window.removeWord = removeWord;
    window.startInlineEdit = startInlineEdit;
    window.saveInlineEdit = saveInlineEdit;
    window.buildGrid = buildGrid;
    window.generateLink = generateLink;
    window.copyLink = copyLink;
    window.previewPlayer = previewPlayer;
    window.checkAll = checkAll;
    window.clearAll = clearAll;
    window.surrender = surrender;
    window.revealHintLetter = revealHintLetter;
    window.backToEditor = backToEditor;
    window.clearUrlAndGoToEditor = clearUrlAndGoToEditor;
    window.mobileNavNext = mobileNavNext;
    window.mobileNavPrev = mobileNavPrev;
    window.shareResult = shareResult;
    window.switchImportTab = switchImportTab;
    window.handleImportFile = handleImportFile;
    window.importFromPaste = importFromPaste;
    window.toggleDirection = toggleDirection;
    window.editorState = editorState;

    // Telegram WebApp link handling
    document.addEventListener('click', function(e) {
        const link = e.target.closest('a.clue-hint-link');
        if (link && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
            e.preventDefault();
            window.Telegram.WebApp.openLink(link.href);
        }
    });

    init();
})();
</script>
</body>
</html>
