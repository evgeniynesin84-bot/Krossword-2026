<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кроссворд‑новости</title>
    <style>
        :root {
            --bg: #f5f3ee;
            --paper: #fffef9;
            --ink: #1a1814;
            --ink2: #5a5650;
            --ink3: #9a9690;
            --accent: #c8401a;
            --accent2: #2a5c8a;
            --border: #d8d4cc;
            --cell-size: 40px;
            --highlight: #fef3e2;
            --highlight-border: #e8a020;
            --active: #fff0e8;
            --active-border: #c8401a;
            --correct: #e8f5e0;
            --correct-border: #4a9a20;
            --wrong: #fde8e8;
            --wrong-border: #d04040;
            --solved-clue: #9a9690;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }

        .masthead {
            background: var(--paper);
            border-bottom: 3px double var(--ink);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .masthead-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
        .masthead-sub { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink2); margin-top: 2px; }
        .mode-pill { padding: 4px 14px; border-radius: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border: 1.5px solid currentColor; }
        .mode-editor { color: var(--accent2); }
        .mode-player { color: var(--accent); }

        .layout { max-width: 1000px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

        .section { background: var(--paper); border: 1px solid var(--border); padding: 1rem; }
        .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink3); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 0.75rem; }

        /* Сетка */
        .grid-scroll { overflow-x: auto; padding: 0.5rem 0; display: flex; justify-content: flex-start; }
        .grid-container { display: inline-grid; gap: 1px; border: 2px solid var(--ink); background: var(--ink); user-select: none; }
        .cell { width: var(--cell-size); height: var(--cell-size); background: var(--paper); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.1s; font-weight: 700; font-size: 16px; color: var(--ink); }
        .cell.black { background: #1a1814; cursor: default; }
        .cell.highlight { background: var(--highlight); outline: 1px solid var(--highlight-border); outline-offset: -1px; }
        .cell.active-cell { background: var(--active); outline: 2px solid var(--active-border); outline-offset: -2px; z-index: 2; }
        .cell.correct-cell { background: var(--correct); outline: 1px solid var(--correct-border); }
        .cell.wrong-cell { background: var(--wrong); outline: 1px solid var(--wrong-border); }
        .cell-num { position: absolute; top: 1px; left: 3px; font-size: 9px; font-weight: 700; color: var(--ink2); line-height: 1; pointer-events: none; }
        .cell input { width: 100%; height: 100%; background: none; border: none; outline: none; text-align: center; font-size: 16px; font-family: 'Georgia', serif; font-weight: 700; color: var(--ink); text-transform: uppercase; cursor: pointer; padding-top: 8px; caret-color: transparent; }

        /* Кнопки */
        .btn { font-family: 'Georgia', serif; font-size: 13px; padding: 8px 16px; border: 1.5px solid var(--ink); background: none; color: var(--ink); cursor: pointer; letter-spacing: 0.03em; transition: all 0.15s; white-space: nowrap; }
        .btn:hover { background: var(--ink); color: var(--paper); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 700; }
        .btn-primary:hover { background: #a83212; border-color: #a83212; color: white; }
        .btn-sm { font-size: 11px; padding: 5px 10px; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 0.5rem; }

        /* Поля */
        .field { margin-bottom: 0.75rem; }
        .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink2); margin-bottom: 4px; }
        .field input, .field textarea { width: 100%; font-family: 'Georgia', serif; font-size: 14px; padding: 7px 10px; border: 1px solid var(--border); background: var(--paper); color: var(--ink); outline: none; transition: border-color 0.15s; }
        .field input:focus, .field textarea:focus { border-color: var(--accent); }
        .field textarea { resize: vertical; min-height: 56px; }

        /* Список слов редактора */
        .word-editor-item { border: 1px solid var(--border); padding: 0.75rem; margin-bottom: 0.75rem; background: var(--bg); position: relative; }
        .word-editor-header { display: flex; align-items: center; gap: 8px; margin-bottom: 0.5rem; }
        .word-editor-num { font-size: 11px; font-weight: 700; background: var(--ink); color: var(--paper); padding: 2px 7px; letter-spacing: 0.05em; }
        .word-editor-len { font-size: 11px; color: var(--ink3); margin-left: auto; }
        .word-editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
        .word-editor-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--ink3); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; }
        .word-editor-del:hover { color: var(--accent); }
        .word-editor-small input { font-size: 12px; padding: 5px 8px; width: 100%; border: 1px solid var(--border); background: var(--paper); color: var(--ink); font-family: 'Georgia', serif; outline: none; }
        .word-editor-small input:focus { border-color: var(--accent); }
        .word-editor-small label { font-size: 10px; color: var(--ink3); display: block; margin-bottom: 2px; letter-spacing: 0.08em; text-transform: uppercase; }

        /* Вопросы игрока */
        .clues-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 600px) { .clues-cols { grid-template-columns: 1fr; } }
        .clues-dir-title { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink2); margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
        .clue-player { display: flex; gap: 6px; padding: 5px 4px; cursor: pointer; border-left: 2px solid transparent; transition: all 0.12s; margin-bottom: 2px; }
        .clue-player:hover { background: var(--highlight); border-left-color: var(--highlight-border); }
        .clue-player.active-clue { background: var(--active); border-left-color: var(--active-border); }
        .clue-player.solved-clue { opacity: 0.45; }
        .clue-player-num { font-size: 12px; font-weight: 700; color: var(--accent2); min-width: 20px; line-height: 1.5; }
        .clue-player-text { font-size: 13px; line-height: 1.45; color: var(--ink); }
        .clue-hint-link { display: inline-block; font-size: 11px; color: var(--accent2); text-decoration: none; margin-top: 2px; letter-spacing: 0.02em; }
        .clue-hint-link:hover { text-decoration: underline; }

        .active-clue-box { background: var(--active); border: 1.5px solid var(--active-border); padding: 0.75rem; margin: 0.5rem 0; min-height: 3rem; font-size: 14px; }
        .active-clue-box .num { font-size: 11px; font-weight: 700; color: var(--ink2); margin-bottom: 2px; }
        .hint-visible { margin-top: 4px; font-size: 12px; }

        .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 0.25rem; }
        .progress-track { flex: 1; height: 4px; background: var(--border); }
        .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
        .progress-label { font-size: 12px; color: var(--ink2); white-space: nowrap; }

        .timer-box { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .timer-box .direction-hint { font-size: 13px; font-weight: 400; color: var(--ink2); }

        .congrats-box { background: var(--correct); border: 2px solid var(--correct-border); padding: 1.5rem; text-align: center; display: none; margin: 0.5rem 0; }
        .congrats-box h2 { font-size: 22px; margin-bottom: 0.5rem; }
        .congrats-box p { font-size: 14px; color: var(--ink2); }
        .congrats-box ul { list-style: none; padding: 0; margin: 1rem 0; text-align: left; }
        .congrats-box li { font-size: 13px; padding: 2px 0; }

        .link-box { background: var(--bg); border: 1px solid var(--border); padding: 0.75rem 1rem; font-family: monospace; font-size: 11px; word-break: break-all; color: var(--ink2); cursor: pointer; margin-top: 0.625rem; line-height: 1.5; }
        .link-box:hover { border-color: var(--accent2); }
        .link-note { font-size: 11px; color: var(--ink3); margin-top: 4px; }
    </style>
</head>
<body>

<div class="masthead">
    <div>
        <div class="masthead-title" id="app-heading">Кроссворд‑новости</div>
        <div class="masthead-sub" id="app-sub">Добавь слова — сетка соберётся сама</div>
    </div>
    <div id="mode-badge" class="mode-pill mode-editor">Редактор</div>
</div>

<div class="layout" id="app-layout"></div>

<script>
(function() {
    let appMode = 'editor';
    let editorState = { title: 'Новости дня', words: [], gridData: null };
    let playerState = {
        answers: {}, selected: null, direction: 'across', solved: {},
        timerInterval: null, startTime: null, elapsedSeconds: 0, gameOver: false
    };

    const el = id => document.getElementById(id);
    const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    // ---------- Сериализация / десериализация ----------
    function serialize(data) {
        const obj = { t:data.title, w:data.words.map(w=>({w:w.word,c:w.clue,h:w.hint||''})),
            p:data.gridData.placedWords.map(pw=>({i:pw.wordIndex,r:pw.startRow,o:pw.startCol,d:pw.direction==='across'?'a':'d',n:pw.number})),
            g:{rs:data.gridData.rows,cs:data.gridData.cols,cl:data.gridData.cells,cn:data.gridData.cellNumbers} };
        return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    }
    function deserialize(str) {
        const obj = JSON.parse(decodeURIComponent(escape(atob(str))));
        const words = obj.w.map(w=>({word:w.w,clue:w.c,hint:w.h||''}));
        return { title:obj.t, words,
            gridData: { rows:obj.g.rs, cols:obj.g.cs, cells:obj.g.cl, cellNumbers:obj.g.cn,
                placedWords: obj.p.map(p=>({wordIndex:p.i,startRow:p.r,startCol:p.o,direction:p.d==='a'?'across':'down',number:p.n,word:words[p.i].word})) } };
    }

    // Получение данных из URL (новый query-параметр или старый hash)
    function getDataFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        if (dataParam) {
            try { return deserialize(dataParam); } catch(e) { console.warn(e); return null; }
        }
        // обратная совместимость: старые ссылки с #
        const hash = window.location.hash.slice(1);
        if (hash) {
            try { return deserialize(hash); } catch(e) { console.warn(e); return null; }
        }
        return null;
    }

    // Генерация ссылки с query-параметром
    function getShareableUrl(data) {
        const base = window.location.origin + window.location.pathname;
        return base + '?data=' + encodeURIComponent(serialize(data));
    }

    // Очистка параметров URL (возврат в редактор)
    function clearUrlAndGoToEditor() {
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.pushState({}, document.title, cleanUrl);
        backToEditor(); // перерисовываем редактор
    }

    // ---------- Логика сетки (без изменений) ----------
    function getWordCellsByPlacement(pw, gd) {
        const cells = [];
        for (let i=0; i<pw.word.length; i++) {
            const r = pw.direction==='across' ? pw.startRow : pw.startRow + i;
            const c = pw.direction==='across' ? pw.startCol + i : pw.startCol;
            cells.push([r, c]);
        }
        return cells;
    }

    function arrangeGrid(words) {
        if (!words.length) return null;
        const sorted = words.map((w,i)=>({...w, _origIndex:i}));
        sorted.sort((a,b)=>b.word.length - a.word.length);
        const placedWords = [], cells = {};
        const first = sorted[0];
        for (let c=0; c<first.word.length; c++) cells[`0,${c}`]=first.word[c];
        placedWords.push({wordIndex:first._origIndex, startRow:0, startCol:0, direction:'across', word:first.word});
        for (let i=1; i<sorted.length; i++) {
            const curr = sorted[i], currWord = curr.word;
            let best = null, bestScore = -Infinity;
            for (const pw of placedWords) {
                for (let pi=0; pi<pw.word.length; pi++) {
                    for (let ci=0; ci<currWord.length; ci++) {
                        if (currWord[ci] !== pw.word[pi]) continue;
                        let newStartRow, newStartCol, newDir;
                        if (pw.direction === 'across') { newDir='down'; newStartRow = pw.startRow - ci; newStartCol = pw.startCol + pi; }
                        else { newDir='across'; newStartRow = pw.startRow + pi; newStartCol = pw.startCol - ci; }
                        const cand = {}; let valid = true;
                        for (let c2=0; c2<currWord.length; c2++) {
                            const r = newDir==='across' ? newStartRow : newStartRow + c2;
                            const c = newDir==='across' ? newStartCol + c2 : newStartCol;
                            const key = `${r},${c}`;
                            if (cells[key] && cells[key] !== currWord[c2]) { valid=false; break; }
                            cand[key] = currWord[c2];
                        }
                        if (!valid) continue;
                        const score = -( Math.abs(pi - pw.word.length/2) + Math.abs(ci - currWord.length/2) );
                        if (score > bestScore) { bestScore = score; best = { startRow:newStartRow, startCol:newStartCol, direction:newDir, cells:cand }; }
                    }
                }
            }
            if (best) {
                Object.assign(cells, best.cells);
                placedWords.push({wordIndex:curr._origIndex, startRow:best.startRow, startCol:best.startCol, direction:best.direction, word:currWord});
            } else {
                const maxRow = Math.max(...Object.keys(cells).map(k=>+k.split(',')[0]), 0);
                const newRow = maxRow + 2, newCol = 0;
                for (let ci=0; ci<currWord.length; ci++) { const key=`${newRow},${newCol+ci}`; if (!cells[key]) cells[key]=currWord[ci]; }
                placedWords.push({wordIndex:curr._origIndex, startRow:newRow, startCol:newCol, direction:'across', word:currWord});
            }
        }
        const keys = Object.keys(cells);
        const rows = keys.map(k=>+k.split(',')[0]), cols = keys.map(k=>+k.split(',')[1]);
        const minRow = Math.min(...rows), maxRow = Math.max(...rows), minCol = Math.min(...cols), maxCol = Math.max(...cols);
        const normCells = {};
        for (const [k,v] of Object.entries(cells)) {
            const [r,c]=k.split(',').map(Number);
            normCells[`${r-minRow},${c-minCol}`] = v;
        }
        const normPlaced = placedWords.map(pw=>({...pw, startRow: pw.startRow-minRow, startCol: pw.startCol-minCol}));
        const cellNums = {}, starts = [];
        for (const pw of normPlaced) {
            const key = `${pw.startRow},${pw.startCol}`;
            if (!starts.find(s=>s.key===key)) starts.push({key, row:pw.startRow, col:pw.startCol});
        }
        starts.sort((a,b)=>a.row-b.row||a.col-b.col);
        starts.forEach((sc,idx)=> cellNums[sc.key] = idx+1);
        normPlaced.forEach(pw=> pw.number = cellNums[`${pw.startRow},${pw.startCol}`]||0 );
        return { rows: maxRow-minRow+1, cols: maxCol-minCol+1, cells: normCells, placedWords: normPlaced, cellNumbers: cellNums };
    }

    // ---------- РЕДАКТОР ----------
    function addWord() {
        const w = el('word-input')?.value.trim().toUpperCase();
        const c = el('clue-input')?.value.trim();
        const h = el('hint-input')?.value.trim();
        if(!w||!c) return alert('Введите слово и описание');
        const clean = w.replace(/\s/g,'');
        if(clean.length<2) return alert('Минимум 2 буквы');
        editorState.words.push({word:clean, clue:c, hint:h});
        editorState.gridData = null;
        renderEditor();
    }
    function removeWord(i) { editorState.words.splice(i,1); editorState.gridData=null; renderEditor(); }
    function buildGrid() {
        if(!editorState.words.length) return alert('Добавьте слова');
        editorState.gridData = arrangeGrid(editorState.words);
        renderEditor();
    }
    function renderEditor() {
        const lay = el('app-layout'); lay.className='layout'; lay.innerHTML = '';
        lay.innerHTML += `<div class="section"><div class="section-label">Настройки</div><div class="field"><label>Название</label><input id="edit-title" value="${esc(editorState.title)}" oninput="editorState.title=this.value"></div></div>`;
        lay.innerHTML += `<div class="section"><div class="section-label">Добавить слово</div>
            <div class="field"><label>Слово</label><input id="word-input" value=""></div>
            <div class="field"><label>Описание</label><textarea id="clue-input" rows="2"></textarea></div>
            <div class="field"><label>Ссылка на источник</label><input id="hint-input" type="url"></div>
            <button class="btn btn-primary" onclick="addWord()">➕ Добавить</button></div>`;
        if(editorState.words.length) {
            let html = `<div class="section"><div class="section-label">Слова (${editorState.words.length})</div>`;
            editorState.words.forEach((w,i)=>{
                html += `<div class="word-editor-item"><button class="word-editor-del" onclick="removeWord(${i})">✕</button>
                    <div class="word-editor-header"><span class="word-editor-num">${i+1}</span> <span>${esc(w.word)}</span> <span class="word-editor-len">${w.word.length} букв</span></div>
                    <div>${esc(w.clue)}</div>${w.hint?`<div style="font-size:12px;color:var(--ink3)">📰 ${esc(w.hint)}</div>`:''}</div>`;
            });
            html += '</div>'; lay.innerHTML += html;
        }
        lay.innerHTML += `<div class="section"><div class="section-label">Сетка</div><button class="btn btn-primary" onclick="buildGrid()">🔧 Собрать кроссворд</button><div id="grid-preview" style="margin-top:1rem"></div></div>`;
        if(editorState.gridData) {
            const gd = editorState.gridData;
            let gridHTML = `<div class="grid-scroll"><div class="grid-container" style="grid-template-columns: repeat(${gd.cols}, var(--cell-size))">`;
            for(let r=0;r<gd.rows;r++) for(let c=0;c<gd.cols;c++) {
                const key=`${r},${c}`, letter=gd.cells[key];
                gridHTML += `<div class="cell${letter?'':' black'}">${letter?`<span class="cell-num">${gd.cellNumbers[key]||''}</span>`:''}${letter||''}</div>`;
            }
            gridHTML += '</div></div>'; el('grid-preview').innerHTML = gridHTML;
            lay.innerHTML += `<div class="section"><div class="section-label">Публикация</div>
                <button class="btn btn-primary" onclick="generateLink()">🔗 Создать ссылку</button>
                <button class="btn" onclick="previewPlayer()">👁 Предпросмотр</button>
                <div id="link-output" style="display:none;margin-top:1rem"><div class="link-box" id="link-text" onclick="copyLink(this)"></div><div class="link-note" id="link-note">Нажми чтобы скопировать</div></div></div>`;
        }
    }
    function generateLink() {
        if(!editorState.gridData) return alert('Соберите кроссворд');
        const url = getShareableUrl(editorState);
        el('link-output').style.display='';
        const linkBox = el('link-text');
        if(linkBox) linkBox.textContent = url;
    }
    function copyLink(boxElement) {
        navigator.clipboard?.writeText(boxElement.textContent).then(()=>{
            const note = document.getElementById('link-note');
            if(note) note.textContent = '✓ Скопировано!';
            setTimeout(()=>{ if(note) note.textContent='Нажми чтобы скопировать'; },2000);
        });
    }

    // ---------- ИГРОК ----------
    function previewPlayer() { if(!editorState.gridData) return alert('Соберите кроссворд'); switchToPlayer(editorState); }
    function switchToPlayer(data) {
        appMode='player';
        el('mode-badge').textContent='Игрок'; el('mode-badge').className='mode-pill mode-player';
        el('app-heading').textContent=data.title||'Кроссворд-новости'; el('app-sub').textContent='Угадайте слова';
        playerState = { answers:{}, selected:null, direction:'across', solved:{}, timerInterval:null, startTime:null, elapsedSeconds:0, gameOver:false };
        window._playerData = data;
        renderPlayer(data);
    }
    function renderPlayer(data) {
        const lay = el('app-layout'); lay.className='layout'; lay.innerHTML = '';
        const gd = data.gridData;
        const across=[], down=[];
        gd.placedWords.forEach(pw=>{
            const w=data.words[pw.wordIndex];
            (pw.direction==='across'?across:down).push({num:pw.number,dir:pw.direction,clue:w.clue,hint:w.hint,word:pw.word,r:pw.startRow,c:pw.startCol});
        });
        across.sort((a,b)=>a.num-b.num); down.sort((a,b)=>a.num-b.num);

        const top = document.createElement('div');
        top.className='section';
        top.innerHTML = `
            <div class="timer-box"><span>⏱ <span id="timer-display">00:00</span></span><span class="direction-hint" id="dir-indicator">→ (горизонталь)</span></div>
            <div class="progress-row"><div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div><span class="progress-label" id="prog-label">0/${gd.placedWords.length}</span></div>
            <div class="btn-row">
                <button class="btn btn-sm" onclick="checkAll()">Проверить</button>
                <button class="btn btn-sm" onclick="clearAll()">Сбросить</button>
                <button class="btn btn-sm" onclick="surrender()">Сдаюсь</button>
                ${!window.location.search && !window.location.hash ? '<button class="btn btn-sm" onclick="clearUrlAndGoToEditor()">← Редактор</button>' : ''}
            </div>
            <div style="font-size:11px;color:var(--ink3);margin-top:6px">←↑↓→ двигаться | клик по вопросу/клетке | ввод букв</div>
        `;
        lay.appendChild(top);

        const congrats = document.createElement('div');
        congrats.className='congrats-box'; congrats.id='congrats';
        lay.appendChild(congrats);

        const activeBox = document.createElement('div');
        activeBox.className='active-clue-box'; activeBox.id='active-box';
        activeBox.innerHTML = '<div class="num">Выберите клетку</div><div>Кликните на клетку или вопрос</div>';
        lay.appendChild(activeBox);

        const gridWrap = document.createElement('div');
        gridWrap.className='section';
        gridWrap.innerHTML = '<div class="section-label">Кроссворд</div><div class="grid-scroll" id="grid-scroll-container"></div>';
        lay.appendChild(gridWrap);

        const gridEl = document.createElement('div');
        gridEl.className='grid-container';
        gridEl.style.gridTemplateColumns = `repeat(${gd.cols}, var(--cell-size))`;
        for(let r=0;r<gd.rows;r++) for(let c=0;c<gd.cols;c++) {
            const key=`${r},${c}`, letter=gd.cells[key];
            const cell = document.createElement('div');
            cell.className='cell'+(letter?'':' black'); cell.id=`cell-${r}-${c}`;
            if(letter) {
                if(gd.cellNumbers[key]) { const s=document.createElement('span'); s.className='cell-num'; s.textContent=gd.cellNumbers[key]; cell.appendChild(s); }
                const inp = document.createElement('input'); inp.type='text'; inp.maxLength=1;
                inp.value = (playerState.answers[key]||'').toUpperCase();
                inp.addEventListener('mousedown', e => { e.preventDefault(); selectCell(r,c,data); inp.focus(); });
                inp.addEventListener('keydown', e => handleKey(e,r,c,data));
                inp.addEventListener('input', e => {
                    if(playerState.gameOver) return;
                    const v = e.target.value.replace(/[^а-яёa-z0-9]/gi,'').toUpperCase().slice(-1);
                    e.target.value = v;
                    playerState.answers[key] = v;
                    if(!playerState.startTime) startTimer();
                    if(v) moveNext(r,c,data);
                });
                cell.appendChild(inp);
            }
            gridEl.appendChild(cell);
        }
        document.getElementById('grid-scroll-container').appendChild(gridEl);

        const cluesSec = document.createElement('div');
        cluesSec.className='section';
        cluesSec.innerHTML = `<div class="section-label">Вопросы</div><div class="clues-cols"><div><div class="clues-dir-title">→ По горизонтали</div><div id="clues-across"></div></div><div><div class="clues-dir-title">↓ По вертикали</div><div id="clues-down"></div></div></div>`;
        lay.appendChild(cluesSec);
        renderClueList(across, 'clues-across', data);
        renderClueList(down, 'clues-down', data);
    }

    function renderClueList(clues, containerId, data) {
        const cont = el(containerId);
        clues.forEach(cl => {
            const div = document.createElement('div');
            div.className='clue-player'; div.id=`cp-${cl.num}-${cl.dir}`;
            div.innerHTML = `<span class="clue-player-num">${cl.num}</span><span class="clue-player-text">${esc(cl.clue)}${cl.hint?`<br><a href="${esc(cl.hint)}" target="_blank" class="clue-hint-link">📰 Источник</a>`:''}</span>`;
            div.onclick = () => { playerState.direction=cl.dir; playerState.selected=`${cl.r},${cl.c}`; highlightWord(cl.r,cl.c,cl.dir,data); showActiveClue(cl.r,cl.c,cl.dir,data); };
            cont.appendChild(div);
        });
    }

    function selectCell(r,c,data) {
        if(playerState.gameOver) return;
        const key=`${r},${c}`;
        if(playerState.selected===key) playerState.direction = playerState.direction==='across'?'down':'across';
        playerState.selected=key;
        highlightWord(r,c,playerState.direction,data);
        showActiveClue(r,c,playerState.direction,data);
        const dirInd = el('dir-indicator');
        if(dirInd) dirInd.textContent = playerState.direction==='across'?'→ (горизонталь)':'↓ (вертикаль)';
    }

    function highlightWord(r,c,dir,data) {
        document.querySelectorAll('.cell').forEach(cell=>cell.classList.remove('highlight','active-cell'));
        document.querySelectorAll('.clue-player').forEach(d=>d.classList.remove('active-clue'));
        const gd=data.gridData;
        const pw = gd.placedWords.find(p => {
            const cells = getWordCellsByPlacement(p, gd);
            return cells.some(([rr,cc])=>rr===r&&cc===c) && p.direction===dir;
        });
        if(pw) {
            const cells = getWordCellsByPlacement(pw, gd);
            cells.forEach(([rr,cc])=> { const cell=el(`cell-${rr}-${cc}`); if(cell) cell.classList.add('highlight'); });
            const activeCell = el(`cell-${r}-${c}`); if(activeCell) { activeCell.classList.remove('highlight'); activeCell.classList.add('active-cell'); }
            const clueDiv = el(`cp-${pw.number}-${pw.direction}`); if(clueDiv) clueDiv.classList.add('active-clue');
        }
    }

    function showActiveClue(r,c,dir,data) {
        const gd=data.gridData;
        const pw = gd.placedWords.find(p => {
            const cells = getWordCellsByPlacement(p, gd);
            return cells.some(([rr,cc])=>rr===r&&cc===c) && p.direction===dir;
        });
        const box=el('active-box');
        if(pw) {
            const w=data.words[pw.wordIndex];
            box.innerHTML = `<div class="num">#${pw.number} ${pw.direction==='across'?'→':'↓'} — ${pw.word.length} букв</div><div>${esc(w.clue)}</div>${w.hint?`<div class="hint-visible"><a href="${esc(w.hint)}" target="_blank">📰 Открыть источник</a></div>`:''}`;
        }
    }

    function handleKey(e,r,c,data) {
        if(playerState.gameOver) return;
        if (e.key==='ArrowRight') { e.preventDefault(); playerState.direction='across'; moveDir(r,c,0,1,data); }
        else if (e.key==='ArrowLeft') { e.preventDefault(); playerState.direction='across'; moveDir(r,c,0,-1,data); }
        else if (e.key==='ArrowDown') { e.preventDefault(); playerState.direction='down'; moveDir(r,c,1,0,data); }
        else if (e.key==='ArrowUp') { e.preventDefault(); playerState.direction='down'; moveDir(r,c,-1,0,data); }
        else if (e.key==='Backspace') {
            const inp = document.querySelector(`#cell-${r}-${c} input`);
            if(inp && !inp.value) { e.preventDefault(); if(playerState.direction==='across') moveDir(r,c,0,-1,data); else moveDir(r,c,-1,0,data); }
        }
    }

    function moveDir(r,c,dr,dc,data) {
        const gd=data.gridData;
        const nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<gd.rows&&nc>=0&&nc<gd.cols&&gd.cells[`${nr},${nc}`]) {
            playerState.selected=`${nr},${nc}`;
            highlightWord(nr,nc,playerState.direction,data);
            document.querySelector(`#cell-${nr}-${nc} input`)?.focus();
            showActiveClue(nr,nc,playerState.direction,data);
            const dirInd = el('dir-indicator');
            if(dirInd) dirInd.textContent = playerState.direction==='across'?'→ (горизонталь)':'↓ (вертикаль)';
        }
    }

    function moveNext(r,c,data) {
        if(playerState.direction==='across') moveDir(r,c,0,1,data);
        else moveDir(r,c,1,0,data);
    }

    function startTimer() {
        if(playerState.timerInterval) return;
        playerState.startTime = Date.now() - playerState.elapsedSeconds*1000;
        playerState.timerInterval = setInterval(()=>{
            const elapsed = Math.floor((Date.now()-playerState.startTime)/1000);
            playerState.elapsedSeconds = elapsed;
            const d = el('timer-display'); if(d) d.textContent = new Date(elapsed*1000).toISOString().substr(14,5);
        }, 300);
    }
    function stopTimer() { if(playerState.timerInterval) { clearInterval(playerState.timerInterval); playerState.timerInterval=null; } }

    function checkAll() {
        const data=window._playerData; if(!data) return;
        const gd=data.gridData;
        gd.placedWords.forEach(pw => {
            const cells = getWordCellsByPlacement(pw, gd);
            const entered = cells.map(([r,c])=> (playerState.answers[`${r},${c}`]||'').toUpperCase() ).join('');
            const correct = entered === pw.word.toUpperCase();
            const key = `${pw.number}-${pw.direction}`;
            if(correct) {
                playerState.solved[key]=true;
                cells.forEach(([r,c])=> { const cell=el(`cell-${r}-${c}`); if(cell) { cell.classList.remove('wrong-cell','highlight','active-cell'); cell.classList.add('correct-cell'); } });
                const cp = el(`cp-${pw.number}-${pw.direction}`); if(cp) cp.classList.add('solved-clue');
            } else if(entered.length>0) {
                cells.forEach(([r,c])=> { const cell=el(`cell-${r}-${c}`); if(cell && !cell.classList.contains('correct-cell')) cell.classList.add('wrong-cell'); });
            }
        });
        updateProgress();
        checkVictory();
    }

    function clearAll() {
        const data=window._playerData; if(!data) return;
        playerState.answers={}; playerState.solved={}; stopTimer();
        playerState.startTime=null; playerState.elapsedSeconds=0; el('timer-display').textContent='00:00';
        document.querySelectorAll('.cell input').forEach(inp=>inp.value='');
        document.querySelectorAll('.cell').forEach(c=>c.classList.remove('correct-cell','wrong-cell','highlight','active-cell'));
        document.querySelectorAll('.clue-player').forEach(d=>d.classList.remove('solved-clue','active-clue'));
        el('congrats').style.display='none';
        el('prog-fill').style.width='0%'; el('prog-label').textContent=`0 / ${data.gridData.placedWords.length}`;
    }

    function surrender() {
        const data=window._playerData; if(!data) return;
        stopTimer(); playerState.gameOver=true;
        const gd=data.gridData;
        gd.placedWords.forEach(pw => {
            const cells = getWordCellsByPlacement(pw, gd);
            cells.forEach(([r,c],i)=>{ const inp=document.querySelector(`#cell-${r}-${c} input`); if(inp) { inp.value=pw.word[i]; playerState.answers[`${r},${c}`]=pw.word[i]; } });
            playerState.solved[`${pw.number}-${pw.direction}`]=true;
        });
        updateProgress();
        showVictoryScreen(true);
    }

    function updateProgress() {
        const total = window._playerData.gridData.placedWords.length;
        const done = Object.keys(playerState.solved).length;
        const progFill = el('prog-fill');
        const progLabel = el('prog-label');
        if(progFill) progFill.style.width = total? (done/total*100)+'%' : '0%';
        if(progLabel) progLabel.textContent = `${done} / ${total}`;
    }

    function checkVictory() {
        const total = window._playerData.gridData.placedWords.length;
        const done = Object.keys(playerState.solved).length;
        if(done >= total && total>0 && !playerState.gameOver) {
            stopTimer(); playerState.gameOver=true;
            showVictoryScreen(false);
        }
    }

    function showVictoryScreen(surrendered) {
        const data = window._playerData;
        const timeStr = el('timer-display').textContent;
        const box = el('congrats'); box.style.display='block';
        let html = `<h2>${surrendered?'Вы сдались':'🎉 Поздравляем!'}</h2><p>Время: ${timeStr}</p><ul>`;
        data.gridData.placedWords.forEach(pw => {
            const w = data.words[pw.wordIndex];
            html += `<li><strong>${pw.number}${pw.direction==='across'?'→':'↓'}</strong> ${pw.word} — ${esc(w.clue)}</li>`;
        });
        html += '</ul>';
        box.innerHTML = html;
    }

    function backToEditor() {
        stopTimer();
        appMode='editor'; 
        el('mode-badge').textContent='Редактор'; 
        el('mode-badge').className='mode-pill mode-editor';
        el('app-heading').textContent='Кроссворд‑новости'; 
        el('app-sub').textContent='Добавь слова — сетка соберётся сама';
        renderEditor();
    }

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function init() {
        const dataFromUrl = getDataFromUrl();
        if(dataFromUrl) {
            window._playerData = dataFromUrl;
            switchToPlayer(dataFromUrl);
        } else {
            renderEditor();
        }
    }

    // Глобальные функции для кнопок
    window.addWord = addWord;
    window.removeWord = removeWord;
    window.buildGrid = buildGrid;
    window.generateLink = generateLink;
    window.copyLink = copyLink;
    window.previewPlayer = previewPlayer;
    window.checkAll = checkAll;
    window.clearAll = clearAll;
    window.surrender = surrender;
    window.backToEditor = backToEditor;
    window.clearUrlAndGoToEditor = clearUrlAndGoToEditor;

    init();
})();
</script>
</body>
</html>
